{% extends "base.html" %}{% block content %}<h1>Editar: {{survey.title}}</h1><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="kind" value="settings"><label>Título<input name="title" value="{{survey.title}}" required></label><label>Descrição<textarea name="description">{{survey.description}}</textarea></label><label>Visibilidade<select name="target"><option value="lojista" {% if survey.target=='lojista' %}selected{% endif %}>Somente lojistas autorizados</option><option value="publico" {% if survey.target=='publico' %}selected{% endif %}>Público geral</option></select></label><label class="check"><input name="active" type="checkbox" {% if survey.active %}checked{% endif %}> Pesquisa aberta para respostas</label><button class="btn">Salvar configuração</button></form></div><div class="card"><h2>Adicionar pergunta</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="kind" value="question"><label>Setor<select name="sector">{% for item in sectors %}<option>{{item}}</option>{% endfor %}</select></label><label>Enunciado<textarea name="text" required maxlength="1000"></textarea></label><button class="btn">Adicionar pergunta</button></form></div><h2>Perguntas</h2>{% for q in survey.questions %}<div class="card"><small>{{q.sector}} · #{{q.position}}</small><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="kind" value="edit_question"><input type="hidden" name="question_id" value="{{q.id}}"><label>Enunciado<textarea name="text">{{q.text}}</textarea></label><label class="check"><input type="checkbox" name="active" {% if q.active %}checked{% endif %}> Ativa</label><button class="btn">Salvar</button> <button class="btn secondary" name="delete" value="yes" onclick="return confirm('Desativar ou excluir esta pergunta?')">Remover</button></form></div>{% endfor %}{% endblock %}
