{% extends "base.html" %}{% block content %}
<h1>Usuários e permissões</h1>
<div class="card"><h2>Criar usuário</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Usuário<input name="username" maxlength="90" required></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><label>Perfil<select name="role">{% for r in roles %}<option value="{{ r }}">{{ r|capitalize }}</option>{% endfor %}</select></label><button class="btn">Criar usuário</button></form></div>
<h2>Cadastros existentes</h2>
{% for u in users %}<div class="card"><form method="post" action="{{ url_for('edit_user', uid=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Usuário<input name="username" value="{{ u.username }}" maxlength="90" required></label><label>Perfil<select name="role">{% for r in roles %}<option value="{{ r }}" {% if u.role==r %}selected{% endif %}>{{ r|capitalize }}</option>{% endfor %}</select></label><label>Redefinir senha (deixe em branco para manter)<input name="password" type="password" minlength="12" autocomplete="new-password"></label>{% if u.id == current_user.id %}<input type="hidden" name="active" value="on"><p class="muted">Seu perfil Master permanece ativo.</p>{% else %}<label class="check"><input type="checkbox" name="active" {% if u.active %}checked{% endif %}> Usuário ativo</label>{% endif %}<button class="btn">Salvar cadastro</button></form></div>{% else %}<p>Nenhum usuário cadastrado.</p>{% endfor %}
{% endblock %}
