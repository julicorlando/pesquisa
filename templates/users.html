{% extends "base.html" %}{% block content %}<h1>Usuários e permissões</h1><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Usuário<input name="username" required></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><label>Perfil<select name="role">{% for r in roles %}<option value="{{r}}">{{r|capitalize}}</option>{% endfor %}</select></label><button class="btn">Criar usuário</button></form></div><div class="card tablewrap"><table><tr><th>Usuário</th><th>Perfil</th><th>Ativo</th><th>Ação</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{"Sim" if u.active else "Não"}}</td><td>{% if u.id != current_user.id %}<form method="post" action="{{url_for('toggle_user',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn secondary">{{"Desativar" if u.active else "Ativar"}}</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
