{% extends "base.html" %}{% block content %}<h1>Gerenciar questionários</h1><div class="card"><h2>Nova pesquisa</h2><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Título<input name="title" required placeholder="Satisfação dos lojistas 2026"></label><label>Identificador da URL<input name="slug" required placeholder="lojistas-2026"></label><label>Descrição<textarea name="description"></textarea></label><label>Público alvo<select name="target"><option value="lojista">Lojistas cadastrados</option><option value="publico">Público geral</option></select></label><button class="btn">Criar pesquisa</button></form></div><h2>Pesquisas cadastradas</h2><div class="cards">{% for s in surveys %}<div class="card"><h3>{{s.title}}</h3><p>{{"Aberta" if s.active else "Fechada"}} · {{s.target}}</p><p><a href="{{url_for('edit_survey',sid=s.id)}}">Editar perguntas e configuração</a></p><a href="{{ url_for('public_survey', slug=s.slug) }}">Link público</a><form method="post" action="{{ url_for('delete_survey', sid=s.id) }}" class="delete-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn danger" onclick="return confirm('Excluir definitivamente esta pesquisa e todos os resultados? Só será permitido se não houver CPF ou CNPJ registrado.')">Excluir pesquisa e resultados</button></form></div>{% endfor %}</div>{% endblock %}
